schema_version = 2

[board]
# Stage-3 active device configuration (verified live GPT/DRAM/EL1/PAC/GOP/PMIC/DarwinBoot in Stages 0-2).
example = false
name = "violin"
soc = "XRING O1"
description = "Xiaomi Pad 7S Pro (O81A, XRING O1)"
kit = "violin"
soc_source = "xring-o1"
os_profile = "ipados-27.0.1-24A446"

[userdata]
# Verified 2026-11-24 against raw /dev/block/sdc GPT header + entries and /sys/class/block/sdc80 (4096-byte UFS blocks).
first_lba = 3138056
last_lba = 129089527
lba_bytes = 4096

[kernel]
defconfig = "violin_defconfig"
config_fragments = ["arch:configs/common.config", "soc:configs/xring-o1.config", "os:configs/ipados.config"]
# Omit os:patches/xnu/series because its zzz-boot-progress.patch assumes sheng's XNU_SHENG_PMGR hunk in bsd_init.c;
# device:patches/xnu/series includes darwin26-{syscalls,kpi,shared-region}.patch directly plus violin patches.
patch_series = ["arch:patches/xnu/series", "soc:patches/xnu/series", "device:patches/xnu/series"]
archives = [
  "build-corecrypto-14.py",
  "build-corecrypto-14.py --namespace",
  "component:ArmDTPlatform",
  "component:ArmCpu",
  "build-libpthread-kernel.py",
  "build-mockfs-fixture.py",
]

[firmware]
# Standalone Mu_Basecore-based UEFI firmware in ../uefi-violin (ViolinPkg).
config = "violin"
dsc = "Platforms/Xiaomi/ViolinPkg/ViolinPkg.dsc"
fd = "Build/ViolinPkg/{target}_CLANGPDB/FV/VIOLIN_UEFI.fd"
preflight = []
submodules = []
patches = []
packages = ["{uefi}", "{tree}/package", "{tree}/drivers/DarwinBoot", "{edk2}"]

[firmware.defines]
DEVICE_MODEL = "violin"

[bootimg]
# Verified 2026-11-24 stock /dev/block/sdc17 (boot_a) and /dev/block/sdc19 (vendor_boot_a):
# both partitions are 100,663,296 bytes (96 MiB) with AVBf footers; boot_a is Android v4
# (ramdisk_size = 0) and vendor_boot_a matches UniXNU vendor_boot v4 (VNDRBOOT, page_size = 4096).
max_image_bytes = 100663296

[payload]
volume = "VIOLINESP"
size_mib = 64
loader = "firmware"
title = "UniXNU (violin)"
# Matches memory@100000000 (2 GiB window inside verified clean 12 GiB high bank 0x100000000..0x3ffffdfff).
dram_size = "0x80000000"
panic_screen = false
timeout = 3
# serial=3 enables XNU serial console (backed by violin_ramoops=1, never physical dwuart3@0xEC118000);
# debug=0x10a = DB_LOG_PI_SCRN|DB_KPRT|DB_PRT (no DB_HALT/DB_NMI hang); cpus=1 for Stage-3 BSP bring-up.
kernel_args = ["-v", "serial=3", "debug=0x10a", "-enable_kprintf_spam", "-no_slto_panic", "wdt=-1", "use_contiguous_hint=0", "kt_fixed_zones=120", "cpus=1", "violin_ramoops=1", "violin_stage3_exit=1"]

[payload.adt]
chip_id = "8142"
# 1 GiB owned memory window accommodates 91 MiB MH_FILESET + APFS/zone pools inside QEMU (2 GiB) and violin (4 GiB).
owned_memory_size = "0x40000000"
psci_method = "smc"
unique_chip_id = "required"
root_match_volume_uuid = "2F8E6EED-68D5-4261-B8A3-12571BAA2DD4"

[device_tree]
source = "device:dts/violin.dts"
include_dirs = ["soc:dts"]

[components]
include = ["ArmDTPlatform", "ArmCpu", "XnuPrelink", "DarwinBoot"]

[adt.chosen.u32]
# XRING O1 has no Apple CTRR; ml_unsafe_kernel_text_init requires this property so bsd_init -> sdt_init does not assert.
kernel-ctrr-to-be-enabled = 0

[adt.defaults.u32]
sleep-disabled = 1
vmm-present = 1

[package]
unixnu = "../UniXNU"

[package.defconfig]
"ipados-27.0.1-24A446" = "violin_defconfig"
"macos-27.3-26C5035r" = "violin_macos_defconfig"

[os_overrides."macos-27.3-26C5035r".kernel]
defconfig = "violin_macos_defconfig"
config_fragments = ["arch:configs/common.config", "soc:configs/xring-o1.config", "os:configs/macos.config"]
patch_series = ["arch:patches/xnu/series", "soc:patches/xnu/series", "device:patches/xnu/series"]

[os_overrides."macos-27.3-26C5035r".payload.adt]
chip_id = "6050"
root_match_volume_uuid = "84581E99-85BE-4957-AC53-2947E887B3E4"
