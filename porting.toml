schema_version = 1

[device]
name = "violin"
soc = "XRING O1"
os_profile = "ipados-27.0.1-24A446"
summary = "Xiaomi Pad 7S Pro (O81A, XRING O1) Format 2 device repository targeting ipados-27.0.1-24A446 and macos-27.3-26C5035r (arm64e). Live 2026-11-24 Stage-0..4 boot_b runs verified EL1 handoff, 5-key PAC + TGran16=1, DPU RCH9 3200x2136 GOP (0x29BFF000), SPMI Ch1 PMIC key input (UniXNU input=yes), VNPDISK2 LZ4 FAT32 payload disk (31.94 MiB -> 100 MiB), and prelinked iPadOS 27.0.1 (24A446) 18-kext MH_FILESET arm64e XNU (xnu-12377.121.6, FIPS HMAC sealed) + real StaticTrustCache (3,547 entries) through corecrypto v27.0 19/19 FIPS POST (55 ms) -> AppleImage4 v7.0.0 -> AMFI -> Sandbox -> vnguard -> StaticTrustCache -> XRING O1 GIC-700 (GICv4.1, stride=0x40000, iidr=0x403043b, GICD_CTLR 0x10->0x12) ArmCpu + 38.4 MHz virtual timer interrupts -> MAC/DLIL/Skywalk/lo0/Zlib/APFS v3288.2.1 -> bsd_init() pre-setconf/vfs_mountroot PASS (armcpu_reg=1 gic_ready=1 timer_irqs=4 delta_200ms=3) -> PSCI_SYSTEM_RESET; xring,ufs block driver, root APFS mount, launchd, SMP, and OS userland boot remain pending Stage-5."

