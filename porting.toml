schema_version = 1

[device]
name = "violin"
soc = "XRING O1"
os_profile = "ipados-27.0.1-24A446"
summary = "Xiaomi Pad 7S Pro (O81A, XRING O1) Format 2 device scaffold targeting ipados-27.0.1-24A446 and macos-27.3-26C5035r (arm64e). Bootloader unlocked; live device capture and UEFI/XNU bring-up pending."

[[area]]
id = "configuration"
status = "planned"
components = []
paths = ["board.toml", "feeds.toml", "local.toml.example", "configs/**", ".github/**", ".gitignore"]
inputs = [
  "UniXNU Format 2 schema and arm64e profiles (ipados-27.0.1-24A446 primary, macos-27.3-26C5035r override).",
  "Shared XRING O1 SoC repository (UniXNU-xring-o1-common) pinned locally via local.toml during development.",
  "Static O1/O81A baseline from MiCode/Xiaomi_Kernel_OpenSource branch violin-v-oss (99a9aff00a2856f065954672660bd0fe0ad0a064).",
]
configuration = [
  "board.toml sets schema_version = 2, soc = XRING O1, soc_source = xring-o1, os_profile = ipados-27.0.1-24A446, example = true.",
  "package.defconfig maps ipados-27.0.1-24A446 -> violin_defconfig and macos-27.3-26C5035r -> violin_macos_defconfig with os_overrides.",
]
procedure = [
  "Run ./unixnu defconfig violin_defconfig -D ../UniXNU-violin and ./unixnu status --json -D ../UniXNU-violin.",
  "Run ./unixnu defconfig violin_macos_defconfig -D ../UniXNU-violin --os macos-27 and inspect os_overrides.",
  "Run python3 scripts/porting-record.py check --device ../UniXNU-violin.",
]
findings = [
  "XRING O1 is non-Qualcomm (GICv3 at 0xEBC00000, ARM SMMUv3, Mali Immortalis-G925), so SM8550 Qualcomm components are excluded.",
  "Dual arm64e target profiles (ipados-27.0.1-24A446 and macos-27.3-26C5035r) share the Format 2 layer order with array replacement in os_overrides.",
]
completion = [
  "All Format 2 config fragments, patch series, and local SoC source bindings resolve without errors for both arm64e profiles.",
]
limits = [
  "board.example = true remains set until live device GPT, DRAM, and uefi-violin paths are filled; feeds.toml uses a placeholder git remote.",
]
next_action = [
  "Populate live device firmware/partition inputs and pin an upstream UniXNU-xring-o1-common git remote.",
]
evidence = []

[[area]]
id = "firmware"
status = "planned"
components = ["DarwinBoot"]
paths = ["proprietary-files.txt", "scripts/package.sh"]
inputs = [
  "Unlocked bootloader on Xiaomi Pad 7S Pro (violin / O81A); historical boot chain runs Android 17 / OS4.0.6.0.XOTCNXM.",
  "Vendor EL2 hypervisor (XHEE via HVC) and BL31 SMC groups documented in violin-v-oss platform/O1/ (bl31_smc_id.h, hvc_id.h).",
  "Future Mu-Silicium board firmware package (uefi-violin) integrating UniXNURamDiskDxe, FAT/DiskIoDxe, and DarwinBoot.",
]
configuration = [
  "board.toml [firmware] defines placeholder uefi-violin DSC/FD paths under Platforms/Xiaomi/violinPkg/.",
  "board.toml [payload] sets loader = firmware, volume = VIOLINESP, dram_size placeholder 0x80000000.",
]
procedure = [
  "Inspect current Android 17 stock boot.img/vendor_boot.img headers and running FDT on hardware before authoring uefi-violin.",
  "Verify BL31/XHEE HCR_EL2.APK/API behavior for arm64e PAC instructions across all 10 CPUs.",
]
findings = [
  "Historical running FDT (2026-11-17) enabled dwuart3@ec118000 and disabled dwuart6@ec11a000, inverting the violin-v-oss base DTS setting.",
  "BL31 exposes PACBTI SMC group (0x06) and XHEE runs at EL2, making hardware PAC trap verification mandatory before claiming arm64e support.",
]
completion = [
  "uefi-violin builds SILICIUM_UEFI.fd, hands off via DarwinBoot, and confirms PAC instructions do not trap under EL2 on all cores.",
]
limits = [
  "No uefi-violin Mu-Silicium repository exists yet; firmware handoff and GOP framebuffer remain unverified on hardware.",
]
next_action = [
  "Capture current bootloader memory map, header constraints, and UART/EL2 PAC behavior from the unlocked violin device.",
]
evidence = []

[[area]]
id = "cpu"
status = "planned"
components = ["ArmCpu", "ArmDTPlatform"]
paths = ["dts/**", "configs/**"]
inputs = [
  "10-core XRING O1 CPU cluster topology (2+2+4+2, MPIDR 0x0..0x900), PSCI 1.0 SMC, and ARMv8 generic timer PPIs 13/14/11/10 at 38.4 MHz.",
  "GICv3 distributor at 0xEBC00000 (0x10000) and redistributor at 0xEBC80000 (0x280000, stride 0x40000).",
  "Reference BSD-2-Clause-Patent O1 ArmCpu notes from ayyy7128/UniXNU-dijun (cntfrq_el0 == 38400000 assertion).",
]
configuration = [
  "UniXNU-xring-o1-common/dts/xring-o1.dtsi defines cpu0..cpu9, top-level /psci (smc), /timer, and gic@ebc00000 (unixnu,adt-name = intc).",
  "configs/violin_defconfig and configs/violin_macos_defconfig enable CONFIG_XNU_ARM_DT_PLATFORM and CONFIG_XNU_ARMCPU.",
]
procedure = [
  "Compile dts/violin.dts with dtc -I dts -O dtb -i ../UniXNU-xring-o1-common/dts.",
  "Implement XRING O1 timer bridge and secondary core PSCI bring-up before testing XNU kernel entry on hardware.",
]
findings = [
  "UniXNU devicetree.py parses all direct children of /cpus as CPU nodes with reg, so cpu-map and idle-states are omitted from xring-o1.dtsi.",
  "O1 Redistributor stride is 256 KiB (0x40000), requiring explicit redistributor-stride in DTS/ADT for ArmCpu.",
]
completion = [
  "All enabled CPUs boot to their XNU entry checkpoint with functional generic timer ticks and GICv3 IPI delivery.",
]
limits = [
  "XRING O1 platform timer bridge header referenced by UniXNU-dijun is not publicly released; live cntfrq_el0 on violin is unmeasured.",
]
next_action = [
  "Verify live cntfrq_el0, MPIDR values, and EL2 PAC behavior on violin, then design XRING O1 ArmCpu/timer integration.",
]
evidence = []

[[area]]
id = "memory"
status = "planned"
components = []
paths = ["dts/**"]
inputs = [
  "Physical DRAM banks and holes captured from UEFI/bootloader runtime memory map on violin.",
  "Vendor reserved regions in violin-v-oss: dpu_logo@20000000 (256 MiB), pstore@a0000000 (1 MiB), ufs_param@70001000, memdump_reserve@43480000.",
  "XRING O1 ARM SMMUv3 blocks (media1 0xE7800000, media2 0xE5400000, npu 0xE9400000; pcie disabled in base DTS).",
]
configuration = [
  "dts/violin.dts keeps placeholder zero memory@0 reg = <0x0 0x0 0x0 0x0> until live device memory map capture.",
  "dts/xring-o1.dtsi marks all arm,smmu-v3 nodes disabled until an SMMUv3 Darwin backend exists.",
]
procedure = [
  "Dump live UEFI/FDT memory and reserved-memory nodes on violin and compare against violin-v-oss baseline.",
  "Populate memory@0, reserved-memory children, and payload.adt owned_memory_* settings before ADT generation.",
]
findings = [
  "O1 uses ARM SMMUv3 rather than MMU-500/SMMUv2, so UniXNU ArmSmmu4K cannot be reused.",
]
completion = [
  "All firmware reservations and non-allocatable carveouts are represented in DTS/ADT and DMA allocations avoid corruption.",
]
limits = [
  "Live DRAM bank layout and current OS4.0 reserved-memory carveouts are uncaptured.",
]
next_action = [
  "Acquire live DRAM base/size and reserved-memory carveouts from target violin firmware.",
]
evidence = []

