schema_version = 1

[device]
name = "violin"
soc = "XRING O1"
os_profile = "ipados-27.0.1-24A446"
summary = "Xiaomi Pad 7S Pro (O81A, XRING O1) Format 2 device repository targeting ipados-27.0.1-24A446 and macos-27.3-26C5035r (arm64e). Live 2026-11-24..26 Stage-0..8C boot_b runs verified EL1 handoff, 5-key PAC + TGran16=1, DPU RCH9 3200x2136 GOP (0x29BFF000), SPMI Ch1 PMIC key input, VNPDISK2 LZ4 FAT32 payload disk, 10 GiB Bank 1 UEFI / exact 8 GiB XNU owned_memory_size (2,041,510 free pages, BOOTSTRAP_TABLE_BYTES=139264), ADT /defaults/kern.maxvnodes=32768 (0 vnode jetsam), 30-kext MH_FILESET arm64e XNU (xnu-12377.121.6, MAX_CPUS=10, XNU_NATIVE_PAN=1, FIPS HMAC sealed), 10/10-core SMP (incl. 2x Cortex-X925), dual KTZ8866A AppleARMBacklight + AppleKeyStoreState, XRING O1 256s DW_APB_WDT 0xEC00C000 feeder (CRASH=Normal), Dual-Boot Scheme D1 (352.47 GiB untouched Android 17 + KernelSU 3.3.1 on slot a + 128.00 GiB UFS 4.1 raw tail carrying 14.67 GiB RO SHNGROOT v2 + 16 GiB 6-layer fenced persistent SHNGDATA), and Stage-8C LIVE touchscreen unlock + High-Hz WC 4-worker FastFb presentation: ARM FF-A xsp1 + EL3 SMC 0xC3002C00 + dw_gpio2 DR1=0x0C + DW APB SPI9 brought up Novatek NVT-36536 TDDI Cascade (fw_ver=0x17, 40x60 THP, touch-orient=4) through 207-slot PAC-audited ViolinHidInput (PrimaryUsage=0x0D/0x04) + 220-slot IOHIDEventDriver FromEdgeTip (0x800) hook, unlocking genuine ipados-27.0.1-24A446 Lock Screen by physical bottom-edge swipe and accurately navigating into Settings -> General (verified photo + 141,362 B ramoops 218bd4d2..., 0 panics, 0 PAC faults, 3,200 MiB free, SHNGROOT 0d7121e2... 100% conserved), while WC 4-worker ldp/stnp ViolinFastFb + vsync=120 cut 3200x2136 frame copy from 50.6 ms -> 7.98 ms min / 10.94 ms avg (5-6.3x speedup, 77.7 FPS peak on Lock Screen). Stage-9 XRING O1 Immortalis-G925 (Mali CSF) GPU/Metal acceleration, UFS MCQ IRQ speedup, and Pogo/USB peripherals remain next."

