schema_version = 1

[device]
name = "violin"
soc = "XRING O1"
os_profile = "ipados-27.0.1-24A446"
summary = "Xiaomi Pad 7S Pro (O81A, XRING O1) Format 2 device repository targeting ipados-27.0.1-24A446 and macos-27.3-26C5035r (arm64e). Live 2026-11-24..25 Stage-0..7E boot_b runs verified EL1 handoff, 5-key PAC + TGran16=1, DPU RCH9 3200x2136 GOP (0x29BFF000), SPMI Ch1 PMIC key input (UniXNU input=yes), VNPDISK2 LZ4 FAT32 payload disk, zero-write peripheral inventory (FF-A v1.0, PERI_CRG I2C3/10/11/12 active, LPIS_ACTRL +0x4C0/+0x4C4=0, all 6 DW GPIO banks 0 traps, I2C3 KTZ8866A@0x11, LPIS_CRG security fence), prelinked iPadOS 27.0.1 (24A446) 28-kext MH_FILESET arm64e XNU (xnu-12377.121.6, MAX_CPUS=10, XNU_NATIVE_PAN=1, XNU_SOURCE_MOCKFS=1, 0 extra stubs beyond upstream prelink-regression.json, 212 native_original_branches_rebound, FIPS HMAC sealed), 04-violin-arm64e-vfpthunk-ioworkloop-pm.patch restoring arm64e clang-24 IOWorkLoop/PM execution, 2-module StaticTrustCache, corecrypto v27.0 19/19 FIPS POST, AppleImage4/AMFI/Sandbox/APFS v3288.2.1, XRING O1 GIC-700 + PSCI SMC 10/10-core SMP (2x A520 + 6x A725 + 2x Cortex-X925 cpu8..9, all step=7, psci_rc=0, fail=0), read-only XringUfs UFSHCI 4.0 Legacy SDB driver (HS-G5 Rate B 2x2, >4GiB 64-bit DMA, LUN 2 GPT 4 KiB SHA-256 exact match b23eed7e...), live NativeGOPPresenter Phase-7A (38.384 ms = 712.3 MB/s) AND live 28-kext NativeLegacyDisplay Phase-7B + IOSurface + IOMobileGraphicsFamily (PM stage=1..4 state=(en=1,pwr=1), 2x 27.34 MB 3200x2136 BGRA IOSurface -> IOMFB swap_start/submit/wait(1) in 58.0 ms copy = 471 MB/s with 6/6 exact scanout pixel readback), and signed arm64e EL0 PID 1 (/sbin/launchd, ncpu=10, pac=ok, simd32=ok) -> SYS_reboot -> PSCI_SYSTEM_RESET(smc); IOBlockStorageDevice APFS root mount, persistent UFS writes, USB-NCM/backlight/touch drivers, and full iPadOS 27 WindowServer GUI userland remain pending subsequent Stage-7 waves."

