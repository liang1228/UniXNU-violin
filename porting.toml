[[area]]
id = "firmware"
status = "planned"
components = ["DarwinBoot"]
paths = ["proprietary-files.txt", "scripts/package.sh"]
inputs = [
  "Unlocked bootloader on Xiaomi Pad 7S Pro (violin / O81A, slot _a) running OS4.0.6.0.XOTCNXM (Android 17, Linux 6.18.21); EDK2-XRING 1.0 user fastboot confirms unlocked=yes, variant=XR_UFS, max-download-size=536870912, and omits fastboot boot (unknown command).",
  "Stock boot_a (/dev/block/sdc17, 100,663,296 B): ANDROID! v4, kernel_size=42,940,928, ramdisk_size=0, AVBf footer; boot_b (/dev/block/sdc46) is verified by HashDescriptor in vbmeta_b.",
  "Stock vendor_boot_a (/dev/block/sdc19, 100,663,296 B): VNDRBOOT v4 matching UniXNU vendor_boot.py (page_size=4096, header_size=2128, dtb_size=221,460, bootconfig_size=206, ramdisk=5,390,315, AVBf footer).",
  "Stock init_boot_a (/dev/block/sdc18, 16,777,216 B, ANDROID! v4 ramdisk=3,104,429) and uefi_a (/dev/block/sdc3, 6,291,456 B).",
  "Stage-0 bare-metal probe via inactive boot_b verified handoff at EL1 (CurrentEL=0x4, XHEE resident at EL2), LOAD_PC=0x200000, X0=0x8200000 (valid FDT 0xd00dfeed, 490,419 B), SCTLR_EL1=0x30d00980 (MMU/caches off), DAIF=0x3c0.",
]
configuration = [
  "board.toml [firmware] holds placeholder uefi-violin DSC/FD paths under Platforms/Xiaomi/violinPkg/.",
  "board.toml [payload] sets loader = firmware, volume = VIOLINESP, dram_size = 0x80000000.",
]
procedure = [
  "Use inactive boot_b with PSCI SYSTEM_RESET fallback to untouched slot a plus DBGC ramoops (0xA0040000 console / 0xA00C0000 pmsg) for repeatable hardware bring-up.",
  "Bring up uefi-violin (Mu-Silicium) with BootShim at 0x200000, UniXNURamDiskDxe, DiskIoDxe, FAT, and GOP/RAM serial logging.",
]
findings = [
  "EDK2-XRING 1.0 user removes fastboot boot (unknown command), but flashing inactive boot_b with set_active b auto-falls back to untouched slot a ('Switch to slot 0') after 7 retries while preserving console-ramoops-0 and pmsg-ramoops-0 across warm reboot.",
  "Bare-metal EL1 probe passed all 5 PAC key MSR write/readback pairs (APIA..APGA) and PACIA/IB/DA/DB/GA execution with 0 traps, proving XHEE sets HCR_EL2.APK=1 and HCR_EL2.API=1.",
  "Stage-1A read-only MMIO probe confirmed GICv3 (0xEBC00000/0xEBC80000, ICC_SRE_EL1=0x7) is accessible with 0 traps, while dwuart3@0xEC118000 raises synchronous external abort (ESR=0x96000010), requiring RAM/ramoops-only SerialPortLib (PcdSerialEnabled=FALSE).",
  "Stage-1B standalone uefi-violin (ViolinPkg on Mu_Basecore + UniXNUPkg + DarwinBootPkg) booted on violin boot_b with 0 asserts: PeilessSec -> DxeCore -> ArmGicV3Dxe -> ArmTimerDxe -> O1SerialDxe -> ViolinGopDxe (RCH9 0x29BFF000 3200x2136) -> UniXNURamDiskDxe (0x8200000 FDT + 0xA200000 initrd) -> DarwinBoot -> UniXNUDxe -> UniXNU 0.1.0 graphical menu (scale 3, landscape) -> 5s PSCI auto-reset back to untouched slot a.",
  "Stage-2A/2B live boot_b runs verified SPMI Ch1 (0xE00011B0/0xE00011A0, non-secure while Ch0/0x800+ are TrustZone-firewalled) read-only polling of PMIC SID 0xF TOP_REG_PCTRL_STATUS3 (0x0E04 = 0x39 idle, active-LOW Vol-/Vol+/Power), ViolinPmicKeyDxe (SimpleTextIn/Ex + ConsoleInDevice + DevicePath -> UniXNU input=yes, QEMU Down/Up/Enter key-nav verified), BootShim VNPDISK1 FAT16 payload disk (0x100800000 -> ViolinPayloadDiskDxe -> EnhancedFatDxe -> \\EFI\\UniXNU\\unixnu.toml), and full DarwinBoot -> ExitBootServices() -> arm64e (0x80000002) Mach-O stub entry passing 10/10 ABI + PAC checks with 28,336 B unbroken dual-ring ramoops.",
  "Stage-3 live boot_b run verified BootShim 84 MiB PAYLOAD_MAX_SIZE + 40 MiB FAT32 VNPDISK1 payload disk + ViolinUEFI-Stage3 (4 GiB Bank 1) + DarwinBoot handoff (pa 0x103004000, entry 0x10353A488, window 512 MiB, FB 0x29BFF000 3200x2136) into real FIPS-HMAC-sealed arm64e XNU xnu-12377.121.6 (--skip-prelink), reaching start_first_cpu (PA) -> PAC+MMU -> serial_init (wcomb ramoops) -> initialize_screen -> arm_init (38.4 MHz) -> pmap_startup (19.7 ms) -> zone_init -> corecrypto 19/19 FIPS POST (191 ms) -> ArmDTPlatform/IONVRAM -> vnguard -> expected kern_trustcache.c:592 (image4 interface not available) -> PSCI_SYSTEM_RESET(smc) with byte-identical 34,279 B dual-ring ramoops and verified stock boot_b/boot_a SHA-256 restore.",
  "Stage-4 live boot_b run verified ViolinUEFI-Stage4 VNPDISK2 LZ4 frame decompression (0x1FF0E00 -> 0x6400000 at 0x1F9800000) + DarwinBoot 1 GiB window handoff (pa 0x102804000, entry 0x106702488) into prelinked iPadOS 27.0.1 (24A446) 18-kext MH_FILESET arm64e XNU + real StaticTrustCache (3,547 entries), passing corecrypto v27.0 19/19 FIPS POST (55 ms), AppleImage4 v7.0.0, AMFI, Sandbox, vnguard, StaticTrustCache, XRING O1 GIC-700 ArmCpu + 38.4 MHz timer IRQs, APFS v3288.2.1, and bounded bsd_init() pre-setconf/vfs_mountroot PASS with byte-identical 39,258 B dual-ring ramoops (SHA-256 66dad7bc...) and verified stock boot_b/boot_a SHA-256 restore.",
]
completion = [
  "uefi-violin builds VIOLIN_UEFI.fd, boots via boot_b, emits RAM logs, renders UniXNU menu with physical button input, and hands off a FAT payload cleanly through DarwinBoot to XNU.",
]
limits = [
  "Stage-4 proved prelinked MH_FILESET boot through corecrypto v27.0, AppleImage4/AMFI/Sandbox/StaticTrustCache, XRING O1 GIC-700 ArmCpu timer interrupts, APFS module start, and bsd_init() pre-setconf/vfs_mountroot; native xring,ufs storage driver, root APFS mount, launchd, and OS userland boot remain pending Stage-5.",
]
next_action = [
  "Build native xring,ufs block driver (or early ramdisk root test) to pass setconf()/vfs_mountroot() into /sbin/launchd and expand SMP/GopFramebuffer/input drivers.",
]
evidence = []

[[area]]
id = "cpu"
status = "planned"
components = ["ArmCpu", "ArmDTPlatform"]
paths = ["dts/**", "configs/**"]
inputs = [
  "Live 2026-11-24 10-core read-only probe: cpu0..1 MIDR 0x410fd801 (0xd80 Cortex-A520 r0p1), cpu2..7 MIDR 0x410fd871 (0xd87 Cortex-A725 r0p1), cpu8..9 MIDR 0x410fd851 (0xd85 Cortex-X925 r0p1).",
  "All 10 cores verified live: CNTFRQ_EL0 = 38400000 Hz, PSCI 1.0 SMC, GICv3 GICD 0xEBC00000 (0x10000) / GICR 0xEBC80000 (0x280000, stride 0x40000).",
  "All 10 cores report ID_AA64ISAR1_EL1 = 0x0011101100211002 (APA/API/GPA/GPI=0) and ID_AA64ISAR2_EL1 = 0x0000000000005102 (APA3=5, GPA3=1 -> FEAT_PACQARMA3 + FEAT_PAuth2 + FEAT_FPAC).",
]
configuration = [
  "UniXNU-xring-o1-common/dts/xring-o1.dtsi defines cpu0..cpu9, top-level /psci (smc), /timer, and gic@ebc00000 (unixnu,adt-name = intc) with timebase-frequency = <38400000>.",
  "configs/violin_defconfig and configs/violin_macos_defconfig enable CONFIG_XNU_ARM_DT_PLATFORM and CONFIG_XNU_ARMCPU.",
]
procedure = [
  "Compile dts/violin.dts with dtc and verify ADT encoding via scripts/make-adt.py.",
  "Implement XRING O1 timer bridge and verify direct EL1 AP*Key MSR writes + secondary core PSCI bring-up on hardware.",
]
findings = [
  "All 10 cores (0..9) executed EL0 PACIA -> AUTIA and PACGA with 0 traps under Linux, and bare-metal EL1 Stage-0 probe on boot CPU cpu0 (0x410fd801, MPIDR 0x80000000) passed all 5 PAC key MSR write/readback pairs (APIA..APGA) and PACIA/IB/DA/DB/GA + AUTIA/IB/DA/DB execution with 0 traps and 0 SErrors under XHEE.",
  "Unmasked bare-metal ID_AA64MMFR0_EL1 (0x2100022200101122) confirms hardware TGran16=1 (16 KiB granule supported), TGran4=0, PARange=40-bit, ASIDBits=16-bit; ID_AA64PFR0_EL1 (0x1201111123111111) confirms GIC=3 and AArch64-only EL0..EL3; PSCI_VERSION SMC returns 0x00010001 (PSCI 1.1) with 0 traps.",
  "Live Linux /sys/firmware/fdt omits timebase-frequency under /cpus (Linux reads CNTFRQ_EL0 directly), whereas UniXNU devicetree.py requires timebase-frequency = <38400000> in DTS.",
  "Stage-4 live boot_b run verified XRING O1 GIC-700 (GICv4.1, stride=0x40000, typer=0x7f041e, iidr=0x403043b) ArmCpu bring-up on boot cpu0: ArmGicV3Dxe ExitBootServices clears GICD_CTLR EnableGrp1NS (0x12->0x10); soc-level ArmCpu restores 0x10->0x12 from NS EL1, clears stale NS PPIs, enables PPI 27 + SGI 0 (splitEoi=0, isenabler0=0x8000001, pmr=0xf0, igrpen1=0x1, sre=0x7), and delivers real 38.4 MHz virtual timer interrupts waking IOSleep(200) (armcpu_reg=1 gic_ready=1 timer_irqs=4 delta_200ms=3).",
]
completion = [
  "Every enabled CPU reaches XNU entry with functional EL1 PAC key writes, generic timer ticks, and GICv3 IPI delivery.",
]
limits = [
  "Boot cpu0 GIC-700 + 38.4 MHz virtual timer IRQs are verified live under cpus=1; secondary-core PSCI CPU_ON SMP bring-up (smp=1) and inter-core IPIs remain pending Stage-5.",
]
next_action = [
  "Verify secondary-core PSCI CPU_ON bring-up (smp=1) and GIC-700 SGI/IPI delivery across all 10 XRING O1 cores.",
]
evidence = []

