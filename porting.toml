findings = [
  "EDK2-XRING 1.0 user removes fastboot boot (unknown command), but flashing inactive boot_b with set_active b auto-falls back to untouched slot a ('Switch to slot 0') after 7 retries while preserving console-ramoops-0 and pmsg-ramoops-0 across warm reboot.",
  "Bare-metal EL1 probe passed all 5 PAC key MSR write/readback pairs (APIA..APGA) and PACIA/IB/DA/DB/GA execution with 0 traps, proving XHEE sets HCR_EL2.APK=1 and HCR_EL2.API=1.",
  "Stage-1A read-only MMIO probe confirmed GICv3 (0xEBC00000/0xEBC80000, ICC_SRE_EL1=0x7) is accessible with 0 traps, while dwuart3@0xEC118000 raises synchronous external abort (ESR=0x96000010), requiring RAM/ramoops-only SerialPortLib (PcdSerialEnabled=FALSE).",
  "Stage-1B standalone uefi-violin (ViolinPkg on Mu_Basecore + UniXNUPkg + DarwinBootPkg) booted on violin boot_b with 0 asserts: PeilessSec -> DxeCore -> ArmGicV3Dxe -> ArmTimerDxe -> O1SerialDxe -> ViolinGopDxe (RCH9 0x29BFF000 3200x2136) -> UniXNURamDiskDxe (0x8200000 FDT + 0xA200000 initrd) -> DarwinBoot -> UniXNUDxe -> UniXNU 0.1.0 graphical menu (scale 3, landscape) -> 5s PSCI auto-reset back to untouched slot a.",
  "Stage-2A/2B live boot_b runs verified SPMI Ch1 (0xE00011B0/0xE00011A0, non-secure while Ch0/0x800+ are TrustZone-firewalled) read-only polling of PMIC SID 0xF TOP_REG_PCTRL_STATUS3 (0x0E04 = 0x39 idle, active-LOW Vol-/Vol+/Power), ViolinPmicKeyDxe (SimpleTextIn/Ex + ConsoleInDevice + DevicePath -> UniXNU input=yes, QEMU Down/Up/Enter key-nav verified), BootShim VNPDISK1 FAT16 payload disk (0x100800000 -> ViolinPayloadDiskDxe -> EnhancedFatDxe -> \\EFI\\UniXNU\\unixnu.toml), and full DarwinBoot -> ExitBootServices() -> arm64e (0x80000002) Mach-O stub entry passing 10/10 ABI + PAC checks with 28,336 B unbroken dual-ring ramoops.",
  "Stage-3 live boot_b run verified BootShim 84 MiB PAYLOAD_MAX_SIZE + 40 MiB FAT32 VNPDISK1 payload disk + ViolinUEFI-Stage3 (4 GiB Bank 1) + DarwinBoot handoff (pa 0x103004000, entry 0x10353A488, window 512 MiB, FB 0x29BFF000 3200x2136) into real FIPS-HMAC-sealed arm64e XNU xnu-12377.121.6 (--skip-prelink), reaching start_first_cpu (PA) -> PAC+MMU -> serial_init (wcomb ramoops) -> initialize_screen -> arm_init (38.4 MHz) -> pmap_startup (19.7 ms) -> zone_init -> corecrypto 19/19 FIPS POST (191 ms) -> ArmDTPlatform/IONVRAM -> vnguard -> expected kern_trustcache.c:592 (image4 interface not available) -> PSCI_SYSTEM_RESET(smc) with byte-identical 34,279 B dual-ring ramoops and verified stock boot_b/boot_a SHA-256 restore.",
  "Stage-4 live boot_b run verified ViolinUEFI-Stage4 VNPDISK2 LZ4 frame decompression (0x1FF0E00 -> 0x6400000 at 0x1F9800000) + DarwinBoot 1 GiB window handoff (pa 0x102804000, entry 0x106702488) into prelinked iPadOS 27.0.1 (24A446) 18-kext MH_FILESET arm64e XNU + real StaticTrustCache (3,547 entries), passing corecrypto v27.0 19/19 FIPS POST (55 ms), AppleImage4 v7.0.0, AMFI, Sandbox, vnguard, StaticTrustCache, XRING O1 GIC-700 ArmCpu + 38.4 MHz timer IRQs, APFS v3288.2.1, and bounded bsd_init() pre-setconf/vfs_mountroot PASS with byte-identical 39,258 B dual-ring ramoops (SHA-256 66dad7bc...) and verified stock boot_b/boot_a SHA-256 restore.",
  "Stage-5 live boot_b run verified --initrd RAMDisk delivery (Payloads/launchd.macho -> /chosen/memory-map/RAMDisk -> md0), 2-module StaticTrustCache (official 24A446 module 0 untouched + Linux-signed 4 KiB-paged arm64e /sbin/launchd module 1), XNU mockfs vfs_mountroot() + devfs /dev/console, and real signed arm64e EL0 PID 1 execution ([EL0_INIT] PASS: pid=1 pagesize=4096 ncpu=8 availcpu=8 memsize=0x40000000 pac=ok(0xbc6afc0100001020) simd32=ok) -> SYS_reboot -> PSCI_SYSTEM_RESET(smc) with byte-identical 42,080 B dual-ring ramoops (SHA-256 962802aa...) and verified stock boot_b/boot_a SHA-256 restore.",
  "Stage-7K (uefi-violin@7c9f074) expanded ViolinPkg Bank 1 PcdSystemMemorySize to 4 GiB (0x100000000) for QEMU_TEST=1 and 6 GiB (0x180000000) for live violin QEMU_TEST=0 (CLANGPDB 0 errors, 4,194,304 B FD each), passing QEMU -m 8G smoke gate (Memory Range 0x100C00000..0x1FFC00000, [VIOLIN_XNU_STUB] RESULT=PASS 10/10).",
]
